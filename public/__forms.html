<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularios</title></head>
<body>
<!-- Plantilla para que Netlify detecte el formulario de AF Academy Online.
     El formulario real está en src/components/OnlineLeadForm.tsx; los nombres deben coincidir. -->
<form name="af-academy-online" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="af-academy-online">
  <input name="bot-field">
  <input name="nombre">
  <input name="ubicacion">
  <input name="whatsapp">
  <input name="acepto">
</form>
</body>
</html>
